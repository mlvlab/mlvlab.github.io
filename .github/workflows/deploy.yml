name: Build site from Notion and deploy

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours (UTC) — Notion edits reach the site within ~6 h
  workflow_dispatch:           # "Run workflow" button in the Actions tab = rebuild now
  push:
    branches: [main]           # template/CSS changes also redeploy

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check image preservation and page behavior
        run: |
          python -m unittest discover -s tests
          node tests/test_frontend.cjs
      - name: Fetch Notion databases
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python fetch_notion.py
      - name: Render site
        run: python render.py
      - name: Package verified content and image backup
        run: python refresh_snapshot.py --from-build --output build/site-backup
      - uses: actions/upload-artifact@v4
        with:
          name: site-backup
          path: build/site-backup
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
